<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Alpine Intelligence Collective</title>
  <meta name="description" content="The Alpine Intelligence Collective">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/globe.js"></script>
</head>
<body>
  <a class="logo" href="#"><img src="assets/images/logo.svg" alt="The Alpine Intelligence Collective, home"><img src="assets/images/logo-purple.svg" alt=""></a>
  <nav class="nav">
    <a href="#shop">shop</a>
    <a href="#gallery">gallery</a>
    <a href="#globe">globe</a>
    <a href="#about">about</a>
  </nav>
  <main>
    <section id="shop">
      <div class="text">
        <p>first release coming soon.</p>
      </div>
    </section>
    <section id="gallery">
      <div class="photos-wrap">
        <div class="photos" style="--cd: 2; --rd: 1; --cm: 1; --rm: 2">
          <img src="assets/gallery/img_3165.jpg" alt="" loading="lazy">
          <img src="assets/gallery/img_3142.jpg" alt="" loading="lazy">
        </div>
      </div>
    </section>
    <section id="globe">
      <div class="frame">
        <div class="earth"></div>
        <div class="plan box">
          <div class="row">
            <button class="open" type="button" aria-pressed="false">relief</button>
            <button class="open" type="button" aria-pressed="false">labels</button>
            <button type="button" aria-pressed="false">course</button>
            <button type="button" hidden>undo</button>
            <button type="button" hidden>export gpx</button>
          </div>
          <div class="chart" hidden></div>
          <div class="settings" hidden>
            <label>show <input class="shown" type="checkbox" checked><output>on</output></label>
            <label>quality <input class="quality" type="range" min="0" max="2" step="1" value="1"><output>mid</output></label>
            <label>render <input class="floor" type="range" min="0" max="3000" step="100" value="900"><output>900 m</output></label>
          </div>
          <div class="settings" hidden>
            <label>show <input class="named" type="checkbox" checked><output>on</output></label>
          </div>
        </div>
      </div>
      <p class="credit"><a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> <a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">&copy; Mapterhorn</a> <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a></p>
    </section>
    <section id="about">
      <div class="text">
        <p>first release coming soon.</p>
      </div>
      <div class="contact">
        <a class="link" href="https://www.instagram.com/alpineintelco/" target="_blank" rel="noopener">@alpineintelco</a>
        <a class="link" href="mailto:alpineintelco@gmail.com">alpineintelco@gmail.com</a>
      </div>
    </section>
  </main>
  <footer>&copy; 2026 The Alpine Intelligence Collective</footer>
</body>
</html>
